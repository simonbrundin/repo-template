# DO NOT EDIT MANUALLY
# Dev database configuration

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

generatorOptions:
  disableNameSuffixHash: true

namespace: dev

resources:
  - ../../base/db

# ConfigMap med schema + seeds (seeds ignoreras i prod)
configMapGenerator:
  - name: repo-template-db-schema
    behavior: replace
    files:
      - schema.sql=../../base/db/schema.sql
      - seeds.sql=../../base/db/seeds.sql
