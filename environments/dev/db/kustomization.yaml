# DO NOT EDIT MANUALLY
# Dev database configuration.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

generatorOptions:
  disableNameSuffixHash: true

namespace: dev

resources:
  - ../../base/db
  - postgres-cluster.yaml
  - app-secret.yaml

patches:
  - target:
      group: db.atlasgo.io
      version: v1alpha1
      kind: AtlasSchema
      name: repo-template-db-schema
    patch: |-
      - op: replace
        path: /spec/urlFrom/secretKeyRef/name
        value: repo-template-db-app-credentials
