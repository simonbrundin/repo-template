# Secret with known password for dev database
apiVersion: v1
kind: Secret
metadata:
  name: repo-template-db-app-credentials
  namespace: dev
type: kubernetes.io/basic-auth
stringData:
  username: app
  password: dev-secret-123
  uri: postgres://app:dev-secret-123@repo-template-db-rw.dev.svc.cluster.local:5432/app?sslmode=require
