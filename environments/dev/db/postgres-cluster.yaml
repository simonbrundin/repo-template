# PostgreSQL Cluster for dev
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: repo-template-db
spec:
  instances: 1

  bootstrap:
    initdb:
      database: app
      owner: app

  storage:
    storageClass: cnpg
    size: 1Gi

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
