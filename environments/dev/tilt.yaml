resources:
  nuxt-app:
    type: dockerfile
    image-name: nuxt-app
    dockerfile: ../../src/nuxt
    port: 80
    links:
      - path: /health/
        name: Health

  go-api:
    type: dockerfile
    image-name: go-api
    dockerfile: ../../src/go
    port: 8080
    links:
      - path: /docs/
        name: Scalar
      - path: /docs/#tag/health/GET/health
        name: Health

  # Dev database resources (CNPG Cluster + ConfigMaps)
  # No workload name - these are managed by CNPG operator
  dev-db:
    type: kustomization
    path: ./db
