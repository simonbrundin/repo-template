resources:
  nuxt-app:
    type: dockerfile
    image-name: nuxt-app
    dockerfile: ../../src/nuxt
    port: 80
    env:
      - name: NUXT_PUBLIC_API_BASE
        value: "http://localhost:17998"
  go-api:
    type: dockerfile
    image-name: go-api
    dockerfile: ../../src/go
    port: 8080
    links:
      - path: /docs/
        name: API Docs (Scalar)
