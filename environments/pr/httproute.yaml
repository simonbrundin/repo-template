apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app
  annotations:
    external-dns.alpha.kubernetes.io/hostname: repo-template-pr.example.com.
spec:
  parentRefs:
    - kind: Gateway
      name: traefik-gateway
      namespace: flux-system
  hostnames:
    - "repo-template-pr.example.com"
  rules:
    - backendRefs:
        - kind: Service
          name: app
          port: 80
