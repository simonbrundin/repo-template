# DO NOT EDIT MANUALLY
# Base database configuration

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

generatorOptions:
  disableNameSuffixHash: true

resources:
  - postgres-cluster.yaml

# ConfigMap with schema + seeds (seeds removed in prod overlay)
configMapGenerator:
  - name: repo-template-db-schema
    files:
      - schema.sql=schema.sql
      - seeds.sql=seeds.sql
