# Atlas Schema CRD - declarative schema management
# https://atlasgo.io/integrations/kubernetes/declarative
apiVersion: db.atlasgo.io/v1alpha1
kind: AtlasSchema
metadata:
  name: repo-template-db-schema
  labels:
    app.kubernetes.io/name: repo-template
spec:
  # Each environment must provide a Secret with the connection URI in key `uri`.
  urlFrom:
    secretKeyRef:
      key: uri
      name: repo-template-db-app

  # Schema from ConfigMap (generated by kustomize from schema.sql)
  schema:
    configMapKeyRef:
      key: schema.sql
      name: repo-template-db-schema

  # Database schema to manage
  schemas:
    - "public"

  # Safety policy - fail on destructive changes
  policy:
    lint:
      destructive:
        error: true
