apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app: pr-flow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pr-flow
  template:
    metadata:
      labels:
        app: pr-flow
    spec:
      containers:
        - name: app
          image: ghcr.io/simonbrundin/pr-flow:latest  # Override this in overlays
          ports:
            - containerPort: 3000
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
