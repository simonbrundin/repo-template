# DO NOT EDIT MANUALLY
# Production database configuration
# Uses base schema but NOT seeds (seeds excluded via behavior: replace)

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

generatorOptions:
  disableNameSuffixHash: true

namespace: prod

resources:
  - ../../base/db

# ConfigMap with ONLY schema (seeds excluded for prod)
configMapGenerator:
  - name: repo-template-db-schema
    behavior: replace
    files:
      - schema.sql=../../base/db/schema.sql
