# Skaffold configuration for local Kubernetes development
# Usage: skaffold dev
apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: repo-template

build:
  artifacts:
    - image: localhost:5000/go-api
      context: src/go
      docker:
        dockerfile: Dockerfile
    - image: localhost:5000/nuxt-app
      context: src/nuxt
      docker:
        dockerfile: Dockerfile

manifests:
  kustomize:
    paths:
      - environments/dev

profiles: []
