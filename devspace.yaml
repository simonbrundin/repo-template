# DevSpace configuration for local Kubernetes development
# Usage: devspace dev
version: v2beta1
name: repo-template

# Images to build (optional - uncomment if you want DevSpace to build)
# images:
#   api:
#     image: localhost:5000/go-api
#     dockerfile: ./src/go/Dockerfile
#   nuxt:
#     image: localhost:5000/nuxt-app
#     dockerfile: ./src/nuxt/Dockerfile

# Deployments using existing Kubernetes manifests
deployments:
  api:
    kubectl:
      manifests:
        - environments/base/go-api-deployment.yaml
        - environments/base/go-api-service.yaml

  nuxt:
    kubectl:
      manifests:
        - environments/base/nuxt-deployment.yaml
        - environments/base/nuxt-service.yaml

# Development mode with hot-reloading
dev:
  api:
    imageSelector: localhost:5000/go-api:latest
    sync:
      - path: ./src/go
    terminal:
      enabled: true

  nuxt:
    imageSelector: localhost:5000/nuxt-app:latest
    sync:
      - path: ./src/nuxt
    terminal:
      enabled: true
